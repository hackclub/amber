_metadata:
  major_version: 1
  minor_version: 1

display_information:
  name: Tickets
  description: File and triage tickets for amber.hackclub.com without leaving Slack
  background_color: "#cc0000"

features:
  bot_user:
    display_name: Tickets
    always_online: true
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  shortcuts:
    - name: Create ticket
      type: message
      callback_id: create_ticket_from_message
      description: File this message as a ticket
    - name: Create ticket
      type: global
      callback_id: create_ticket
      description: File a new ticket

oauth_config:
  scopes:
    bot:
      # Required by Slack for shortcuts, even though this app has no slash command
      - commands
      - chat:write
      - im:write
      - users:read
      - users:read.email

settings:
  interactivity:
    is_enabled: true
    request_url: https://amber.hackclub.com/slack/interactions
  event_subscriptions:
    request_url: https://amber.hackclub.com/slack/events
    bot_events:
      - app_home_opened
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
