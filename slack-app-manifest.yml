# Source of truth for the Ambot Slack app (A0BQECK593K).
# Push changes with the snippet in README.md — note that changing the events
# request URL makes Slack re-verify it, so the app must be deployed and
# SLACK_SIGNING_SECRET set to Ambot's secret before that will be accepted.
_metadata:
  major_version: 1
  minor_version: 1

display_information:
  name: Ambot
  description: amber but bot
  background_color: "#ba56ba"

features:
  bot_user:
    display_name: Ambot
    always_online: true
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  shortcuts:
    - name: File a ticket
      type: message
      callback_id: file_msg_ticket
      description: Need Amber help? File a ticket
    - name: File a ticket
      type: global
      callback_id: file_ticket
      description: Need Amber help? File a ticket

oauth_config:
  scopes:
    bot:
      # Required by Slack for shortcuts, even though this app has no slash command
      - commands
      - chat:write
      - chat:write.public
      # Opens a DM with someone the bot hasn't messaged before
      - im:write
      - users:read
      - users:read.email
      - users.profile:read
      - channels:read
      - channels:history

settings:
  interactivity:
    is_enabled: true
    request_url: https://amber.hackclub.com/slack/interactions
  event_subscriptions:
    request_url: https://amber.hackclub.com/slack/events
    bot_events:
      - app_home_opened
  org_deploy_enabled: false
  # Off deliberately: Socket Mode and HTTP request URLs are mutually exclusive,
  # and the ticket app receives interactions over HTTP.
  socket_mode_enabled: false
  token_rotation_enabled: false
